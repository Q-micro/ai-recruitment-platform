services:
  server:
    image: node:22-alpine
    container_name: khutwa-server
    working_dir: /app
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  client:
    image: node:22-alpine
    container_name: khutwa-client
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules: